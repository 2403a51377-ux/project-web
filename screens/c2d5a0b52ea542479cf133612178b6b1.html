<div class="absolute top-3 left-3 bg-surface-container-lowest/90 backdrop-blur-md px-3 py-1.5 rounded-full shadow-md flex items-center gap-1.5">
<span class="material-symbols-outlined text-secondary text-base" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>

</div>

<div class="flex items-center gap-2 mb-2">
<span class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight">Foodie</span>
<span class="text-primary-container text-2xl font-bold leading-none">●</span>
</div>
<p class="font-headline-md text-headline-md text-primary-container font-bold mb-space-sm tracking-tight">

<span class="material-symbols-outlined text-xl transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<button class="w-full py-3.5 text-center font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center gap-1.5" type="button">

</button>
</div>
<!-- Micro-interactions Script -->
<script>
    (function() {
      const btn = document.getElementById('getStartedBtn');
      if (btn) {
        btn.addEventListener('click', function(e) {
          this.classList.add('scale-95');
          setTimeout(() => this.classList.remove('scale-95'), 120);
        });
      }
    })();
  </script>
